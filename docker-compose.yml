services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-compta_matieres}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compta_matieres}"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-compta_matieres}
      JWT_SECRET: ${JWT_SECRET:-changez-ce-secret-en-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@entreprise.mg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports: ["5050:80"]
volumes:
  pgdata:
